name: Monthly SEO/AEO/GEO Guidelines Update

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-guidelines:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run SEO update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-seo-guidelines.js

      - name: Check if draft was produced
        id: check
        run: |
          if [ -f "seo-updates-draft.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Draft file found."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No draft produced — nothing to PR."
          fi

      - name: Create Pull Request for review
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: seo-guidelines-update/${{ github.run_id }}
          delete-branch: true
          commit-message: "chore: monthly SEO/AEO/GEO guidelines draft — ${{ github.run_id }}"
          title: "📋 Monthly SEO Update — Review & merge into CLAUDE.md"
          body: |
            ## Monthly SEO/AEO/GEO Guidelines Update

            This PR was automatically generated by the monthly SEO update workflow.

            ### What to do
            1. Open `seo-updates-draft.md` in this PR and read the update sections
            2. Copy any genuinely new best practices into the **SEO Best Practices**, **AEO**, and **GEO** sections of `CLAUDE.md`
            3. Delete `seo-updates-draft.md` from the repo
            4. Merge this PR

            > Sources checked: Google Search Central Blog, Search Engine Journal, Search Engine Land, Moz Blog

            > If no action is needed (no significant changes this period), simply close this PR without merging.
          labels: |
            seo-update
            automated
            needs-review
